# 意图识别关键词规则表（参考 open-agent-master 的 intent-rules.yml）
#
# 匹配逻辑（IntentRouter）：
#   1. rag 词表命中且带疑问语气（怎么/什么/吗/？等）→ rag（知识问答免 LLM）
#   2. business 词表命中 → 先做「疑问语气仲裁」：
#      句子带疑问语气 且 不含祈使派活标记（action_markers）→ rag
#      （业务词只是话题词：起飞流程/云台抖/飞手装备，真实意图是求答案；
#        控制指令必然带祈使标记：帮我起飞 / 把无人机降落下来）
#      否则 → business
#   3. chitchat 词表命中的短输入（<=12 字）且无其他命中 → chitchat（免 LLM）
#   4. 其余交给 LLM 分类兜底；LLM 失败时默认 chitchat
#
# 词表只放「高置信」关键词，宁缺毋滥——拿不准的交给 LLM。

rag:
  - 实名登记
  - 备案
  - 执照
  - 考证
  - 保险
  - 理赔
  - 黑飞
  - 适飞空域
  - 限高
  - 禁飞
  - 限飞
  - 什么原理
  - 的区别
  - 什么区别
  - 怎么选
  - 需要吗
  - 要不要考证
  - 重量是多少
  - 多重

business:
  - 航线
  - 航线规划
  - 巡检
  - 起飞
  - 降落
  - 返航
  - 悬停
  - 任务下发
  - 飞行任务
  - 图传
  - 云台
  - 电池电量
  - 设备管理
  - 飞手
  - 空域申请
  # 账号域与设备状态话题词（2026-09-18 误路由修复配套）：
  # 疑问语气仲裁仍生效——「账号能注销吗」依旧走 rag；
  # 祈使式「把 tomcat 账号停用」可免 LLM 兜底直达 business。
  - 账号
  - 账户
  - 停用
  - 空闲
  - 视频文件
  - 文件名

chitchat:
  - 你好
  - 您好
  - 在吗
  - 在不在
  - 谢谢
  - 感谢
  - 你是谁
  - 你叫什么
  - 再见
  - 晚安
  - 早上好
  - 下午好
  - 讲个笑话
  - 聊聊
  - 无聊

# 祈使派活标记：出现即认为用户在「派任务」而非「问知识」。
# 与疑问语气同时出现时（如「帮我起飞吗」不对劲但「可以帮我降落吗」很常见），派活优先。
# 注意「帮我看看/帮我查」类是求助式提问的前缀，不算派活（见 action_cancel）。
action_markers:
  - 帮我
  - 给我
  - 把
  - 执行
  - 开始
  - 下发
  - 安排
  - 规划
  - 设置
  - 打开
  - 关闭
  - 启动
  - 立即
  - 马上
  - 现在就
  - 去吧
  - 起飞吧
  - 降落吧
  - 返航吧

# 求助式提问前缀：先剔除这些短语再做祈使标记判断，
# 避免「帮我看看云台为什么一直抖」被误判为派活。
action_cancel:
  - 帮我看看
  - 帮我看下
  - 帮我看一看
  - 帮我查
  - 帮我分析
  - 帮我解释
  - 帮我回答
  - 帮我排查
  - 帮我想想
  - 帮我说说
