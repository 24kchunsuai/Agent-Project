# 口语 → 规范术语映射词典（方案⑥ 查询扩展）
#
# 用途：把用户口语、简称、行业黑话映射成知识库语料里的**规范表述**，
#       再送去 BM25 + 向量召回。纯本地确定性规则，零 LLM 成本、零延迟。
#
# 为什么需要（实测依据）
# --------------------
# 中文分词不认口语复合词，BM25 会把它们切碎后逐字匹配：
#   「黑飞」→ 切成分词后与语料里的「未经批准」「违规飞行」全都对不上，
#   而语料 penalty 篇正文里**根本没有「黑飞」二字**，
#   于是召回到含「黑」「飞」的无关文档且顶到前面（DEV_ISSUES 6.4 ⭐，实测排名第 8）。
# 「限高」只有两个字，向量语义也太空，实测排名同样掉到第 8（eval-039）。
#
# 结构
# ----
#   terms:  子串命中的口语词 → 规范表述（多个用列表，逗号连接追加）
#   suffix: 极短查询（≤3 字）整句命中时，替换为完整问句——
#           这类词单独出现时语义太空，必须补全而不是简单扩写
#
# ⚠️ terms 只收录「知识库里根本没有的写法」——即口语、简称、行业黑话。
#    规范术语本身（如「实名登记」「操控员执照」「管制空域」）不要收：
#    它们已是检索词原形，再追加同义表述只会稀释原始语义（实测
#    「无人机实名登记在哪个平台办理？」被追加尾巴后召回反而变糊）。
#    判断方法：`grep "<词>" data/kb/raw` 能直接命中的，就不是口语词，不该收。
#
# 维护约定
# --------
# · 规范表述**必须在知识库语料里真实出现**（加词前先去 data/kb/raw 核对），
#   否则扩写反倒把召回带偏。本文件所有词条均已核对。
# · 只加「确定性映射」；有歧义的词不加（宁缺毋滥）。
# · 新增后跑 scripts/rewrite_probe.py 验证排名确有提升。

# ---- 子串词条：口语 → 规范表述 ----
#
# 只收「语料里查不到」的写法。逐条核对依据写在注释里。
terms:
  # 违规飞行：治理 eval-040。penalty 篇正文**没有「黑飞」二字**（实测排名第 8），
  # 语料真实措辞是「未经批准」「违规飞行」「处罚标准」「责令停止飞行」。
  黑飞: 未经批准 违规飞行 处罚标准 责令停止飞行 罚款
  黑飞行为: 未经批准 违规飞行 处罚标准
  # 限高 / 限飞 / 禁飞：语料用「真高」「管制空域」「空中禁区」，不用「限高」。
  限高: 真高 120 米 管制空域 飞行高度限制
  限飞: 管制空域 飞行限制
  禁飞: 空中禁区 管制空域 禁止飞行区域
  # 贴码：语料用「实名登记」「登记标志」，无「贴码」说法（治理 eval-010）。
  二维码: 实名登记 登记标志
  贴码: 实名登记 登记标志 粘贴
  # 炸机 / 摔机 / 飞丢：语料用「坠机」「失控」「失联」。
  炸机: 坠机 失控坠落 异常处置
  摔机: 坠机 异常处置
  飞丢: 失联 失控
  # 拍婚礼：语料用「飞行活动申请」「航拍」。
  拍婚礼: 飞行活动申请 航拍
  # 办证：语料用「操控员执照」「实名登记」。
  办证: 操控员执照 实名登记
  # 分类词（微型/轻型）：语料里有这三个词，但单独作前缀时语义太薄——
  # 「微型无人机的重量上限是多少」原句 top1 落在 model-mavic-302（机型库），
  # 期望的 reg-classification-001 排到第 4。必须补上**整句数值**才压得住机型库：
  # 实测补「空机重量」只到 #2，补全「空机重量小于 0.25 千克」才能拿回 #1。
  # ⚠️ 这是「语义补充」而非「术语映射」——本节的例外，特此说明，见 DEV_ISSUES 6.62 §4。
  微型: 空机重量小于 0.25 千克 微型无人机
  轻型: 空机重量不超过 4 千克 轻型无人机

# ---- 极短查询补全表：整句等于 key（或去标点后相等）时替换为完整问句 ----
#
# 为什么单独一张表：这类词作为词条扩写仍语义不足（「限高」→「真高 120 米
# 管制空域 飞行高度限制」可能还不够），补成完整问句召回最稳。
suffix:
  限高: 无人机飞行高度限制是多少，真高 120 米以上属于管制空域的规定
  禁飞: 哪些区域属于禁飞区，空中禁区和管制空域的规定
  限飞: 哪些区域属于限飞区，飞行限制区域和空域管理规定
  黑飞: 无人机黑飞（未经批准违规飞行）会有什么处罚后果
  登记: 无人机实名登记怎么办理，在哪个平台办理
  执照: 无人机操控员执照怎么考取，报名条件是什么
  炸机: 无人机炸机坠机的原因和异常处置办法
  失控: 无人机失控失联的异常处置办法
