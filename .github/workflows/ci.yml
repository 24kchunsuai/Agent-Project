# ==============================================================================
# GitHub Actions：CI 门禁（企业级落地规约 E-4）
#
# ⚠️ 这是**备选**配置，不是当前主力。
#    当前仓库托管在 Gitee，主力 CI 是 .workflow/ci.yml（Gitee Go）。
#    本文件的用途只有一个：将来若把仓库镜像/迁移到 GitHub，门禁口径可以直接沿用，
#    不必重新设计。三作业与 Gitee Go 版逐条对应。
#
# 本地等价物：bash scripts/ci.sh（离线可跑，且能故意改坏验红）
# ==============================================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  python-test:
    name: Python 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agt_python/requirements.txt
      - name: 安装依赖
        run: pip install -r agt_python/requirements.txt
      - name: pytest
        working-directory: agt_python
        # 4 项已知失败基线写在 pytest.ini 的 --deselect 里，本地与 CI 共用口径
        run: python -m pytest

  java-test:
    name: Java 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn test
        working-directory: agt_backend
        # -T 1C：按核数并行编译。测试本身不连任何外部服务（见 application-test.properties）
        run: mvn -B -T 1C test

  web-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agt_web/package-lock.json
      - name: npm ci && npm run build
        working-directory: agt_web
        run: npm ci && npm run build
