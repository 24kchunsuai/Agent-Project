spring.application.name=agt_backend

# ===== HTTP server =====
server.port=8080

# ===== Python agent service =====
# Python 端地址；容错规约 §7 超时分层：非流式请求要覆盖 LLM 重试序列
# （约 190s）+ 工具序列，2026-09-18 由 60s 核定为 240s
agent.base-url=http://localhost:8000
agent.connect-timeout=3000
agent.read-timeout=240000
# 健康聚合（E-3）专用读超时：故意远小于业务超时。健康探测自己就是"还活着吗"
# 的判据，等 240s 才报红等于没有告警（Python 僵死时前端状态灯会 4 分钟不响应）。
agent.ops-read-timeout=5000
# 服务间共享密钥（企业级落地规约 S-1）：真实值走环境变量，**不进代码库**。
# 必须与 agt_python/.env 的 AGENT_SHARED_KEY 同值；留空则本服务拒绝启动（fail-closed）。
agent.shared-key=${AGENT_SHARED_KEY:}

# ===== 无人机业务后端（jsdstu-3）=====
# 认证代理与业务工具调用的目标系统；账号体系以它为准
drone.base-url=http://localhost:8060

# ===== Knife4j / springdoc =====
knife4j.enable=true
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=cn.tedu.agt

# ===== logging =====
logging.level.root=warn
logging.level.cn.tedu.agt=debug
