# ===== 测试环境配置（企业级落地规约 E-5）=====
#
# 目的：让测试**不依赖任何外部服务**，断网可跑（E-5 验收标准）。
#
# agent.shared-key 不是真密钥，只是一个占位值：S-1 之后 KbClient / GovernanceClient
# 等真实 bean 在**构造时**就会调 AgentAuth.requireSharedKey（fail-closed），
# 没有它连测试上下文都起不来。真实密钥从不进代码库，也不进测试。
agent.shared-key=test-shared-key-not-a-real-secret

# 下游地址刻意指向一个必定连不上的端口：
# 万一某个测试"忘了 mock、真去连了下游"，它会立刻连接被拒而失败，
# 而不是静默走通。把失误暴露在测试里，而不是留在测试外。
agent.base-url=http://127.0.0.1:1
drone.base-url=http://127.0.0.1:1

logging.level.root=warn
logging.level.cn.tedu.agt=warn
