# ============================================================
# agt_web 的 nginx 站点配置 —— E-14（容器化）与 S-2（前端构建 + nginx）
# **同一份配置，不写两份**（企业级落地规约 §5 映射表）。
#
# 挂载点：容器内 /etc/nginx/conf.d/default.conf
#
# 三条路由规则（与 vue.config.js devServer 的开发代理一一对应，
# 前端代码零改动）：
#   /v1/*  → agt-backend:8080   浏览器唯一的后端入口；
#                              8000 无宿主端口、不进 nginx ——
#                              "浏览器摸不到 Python 服务"（S-1 意图不变）
#   /*     → SPA 静态资源，history 路由回退 index.html
#                              （createWebHistory 刷新 404 的解法，
#                              devServer 侧是 historyApiFallback）
#
# ⚠️ SSE（聊天逐字流）必须关缓冲 + 放宽读超时：
#   proxy_buffering off  +  proxy_read_timeout 300s（规约 E-14 硬要求）。
#   漏掉的表现：逐字流变成"卡半天一次性蹦全段"，且长对话被 504 掐断。
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传与请求体上限（知识库文档上传走 /v1/kb）
    client_max_body_size 20m;

    # ---------- 后端 API：/v1 → 8080 ----------
    location /v1/ {
        proxy_pass http://agt-backend:8080;
        proxy_http_version 1.1;

        # SSE 三件套：关缓冲、放宽读超时、HTTP/1.1 长连接
        # （Connection "" 清掉默认的 close，配合 http_version 1.1）
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 前端静态资源 ----------
    # 带指纹的构建产物（js/css）长缓存；index.html 与 version.json 不缓存，
    # 保证发版后浏览器立刻拿到新入口（E-1 版本出口之一）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # history 路由回退：刷新 /dashboard/costs 这类深链时交回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 压缩 ----------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;
    gzip_min_length 1024;
}
