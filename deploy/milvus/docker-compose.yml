# ============================================================
# Milvus Standalone v2.6.24 单机部署（drone-agent001 RAG 知识库用）
#
# 与官方 compose 的差异（均为本地环境的必要适配）：
#   1. MinIO / etcd 不映射宿主机端口 —— 避免与本机已有的
#      minio(9000/9001) 和 Vue dev server(9090) 冲突，
#      Milvus 只需经内部网络访问它们。
#   2. 仅暴露 19530(gRPC/REST) 与 9091(WebUI/health)。
#   3. 增加内存上限，防止 Milvus 索引构建时 OOM 拖垮宿主机
#      （本机 Docker 可见内存约 7.5GB，另有 6 个业务容器在跑）。
#   4. 数据卷落在 ./volumes 下，便于随项目一起备份/清理。
#
# 启动：docker-compose up -d
# 停止：docker-compose down          （保留数据）
# 清库：docker-compose down -v && rm -rf ./volumes   （⚠️ 数据全灭）
# ============================================================

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_limit: 512m
    networks:
      - milvus-net

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # 兼容旧版 minio 的环境变量名
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_limit: 1g
    networks:
      - milvus-net

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.24
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    mem_limit: 3g
    networks:
      - milvus-net

networks:
  milvus-net:
    name: milvus-net
    driver: bridge
